[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-probe"
version = "0.1.0"
description = "Evidence-aware security testing for LLM agents and MCP integrations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AgentProbe contributors"}]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3", "typer>=0.12,<1", "rich>=13.8,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]
semantic = ["sentence-transformers>=3,<6"]

[project.scripts]
agentprobe = "agentprobe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentprobe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agentprobe"]
